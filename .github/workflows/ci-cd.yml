name: CI/CD — Build, Push to ECR, Deploy to EKS

on:
  push:
    branches:
      - main         # Triggers on every push/merge to main
  workflow_dispatch: # Also allows manual trigger from GitHub Actions UI

# Concurrency: cancel in-progress runs if a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}               # e.g. ap-south-1
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}   # e.g. qpaper-cluster
  ECR_BACKEND_REPO: qpaper-backend
  ECR_FRONTEND_REPO: qpaper-frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build and push backend image to ECR
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CI }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the backend Docker image
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest \
            ./backend

          # Push both the SHA-tagged and latest tags
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

          # Output the full image URI for the deploy job
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build and push frontend image to ECR
  # NEXT_PUBLIC_API_URL and NEXT_PUBLIC_GOOGLE_CLIENT_ID are
  # passed as --build-arg so they get baked into the Next.js bundle
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CI }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # These come from GitHub Secrets — baked into the Next.js bundle
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest \
            ./frontend

          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest

          echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy to EKS (runs after both builds succeed)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # Wait for both builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CI }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # ── Apply non-secret Kubernetes resources ──────────────────
      - name: Apply namespace and configmap
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      # ── Create/update the K8s Secret from GitHub Secrets ───────
      # Using kubectl create secret with --dry-run + apply pattern
      # so it works whether the secret exists or not
      - name: Create or update K8s Secret
        run: |
          kubectl create secret generic qpaper-secrets \
            --namespace=qpaper \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=MONGODB_URL="${{ secrets.MONGODB_URL }}" \
            --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Apply deployment manifests ──────────────────────────────
      - name: Apply deployment manifests
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/celery-worker-deployment.yaml
          kubectl apply -f k8s/celery-beat-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/services.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      # ── Update image tags to the newly built images ─────────────
      - name: Update backend image
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          BACKEND_IMAGE="$ECR_REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}"
          kubectl set image deployment/backend \
            backend=$BACKEND_IMAGE -n qpaper
          kubectl set image deployment/celery-worker \
            celery-worker=$BACKEND_IMAGE -n qpaper
          kubectl set image deployment/celery-beat \
            celery-beat=$BACKEND_IMAGE -n qpaper

      - name: Update frontend image
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          FRONTEND_IMAGE="$ECR_REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}"
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_IMAGE -n qpaper

      # ── Wait for rollout to complete ────────────────────────────
      - name: Wait for deployments to roll out
        run: |
          echo "⏳ Waiting for backend rollout..."
          kubectl rollout status deployment/backend -n qpaper --timeout=300s

          echo "⏳ Waiting for celery-worker rollout..."
          kubectl rollout status deployment/celery-worker -n qpaper --timeout=300s

          echo "⏳ Waiting for celery-beat rollout..."
          kubectl rollout status deployment/celery-beat -n qpaper --timeout=120s

          echo "⏳ Waiting for frontend rollout..."
          kubectl rollout status deployment/frontend -n qpaper --timeout=300s

      # ── Print the ALB URL after first deploy ───────────────────
      - name: Get ALB URL
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "✅ Deploy complete!"
          echo ""
          echo "📋 ALB URL (may take 1-2 min to become active):"
          kubectl get ingress qpaper-ingress -n qpaper \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
          echo ""
          echo "👉 If this is your first deploy, copy the ALB URL above,"
          echo "   add it to GitHub Secrets as NEXT_PUBLIC_API_URL,"
          echo "   then push again to rebuild the frontend with the real URL."
          echo "════════════════════════════════════════════════════════"

      # ── Print pod status for debugging ─────────────────────────
      - name: Show pod status
        if: always()
        run: |
          kubectl get pods -n qpaper
          kubectl get ingress -n qpaper
